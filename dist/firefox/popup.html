<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-row">
      <div class="logo">
        <span class="icon">🎧</span>
        <span class="title">Whisper Live Subs</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>
    <div class="status-badge" id="status-badge">
      <span class="status-dot disconnected" id="status-dot"></span>
      <span class="status-text" id="status-text">Connecting...</span>
    </div>
  </div>

  <div class="history-action-box">
    <button id="open-history-btn" class="btn btn-history">
      <span class="btn-icon">📜</span>
      <span class="btn-label">Open Subtitle History</span>
      <span class="btn-arrow">↗</span>
    </button>
  </div>

  <div class="section settings-section">
    <div class="section-label">Display & Behavior</div>

    <div class="control-row row-flex">
      <label for="pause-with-video">Pause subs when video pauses:</label>
      <input type="checkbox" id="pause-with-video" checked>
    </div>

    <div class="control-row">
      <label for="font-size">Font Size: <span id="font-size-val">28px</span></label>
      <input type="range" id="font-size" min="16" max="52" value="28">
    </div>

    <div class="control-row">
      <label for="bottom-offset">Bottom Distance: <span id="bottom-offset-val">60px</span></label>
      <input type="range" id="bottom-offset" min="10" max="180" value="60">
    </div>

    <div class="control-row row-flex">
      <label for="alignment">Vertical Position:</label>
      <select id="alignment" class="styled-select">
        <option value="bottom">Bottom of Video</option>
        <option value="top">Top of Video</option>
      </select>
    </div>

    <div class="control-row row-flex">
      <label for="bg-box">Background Box:</label>
      <input type="checkbox" id="bg-box" checked>
    </div>

    <div class="control-row row-flex">
      <label for="stack-mode">Rolling Stack (Fade Older Lines):</label>
      <input type="checkbox" id="stack-mode" checked>
    </div>

    <div class="control-row" id="max-lines-row">
      <label for="max-lines">Max Stack Lines: <span id="max-lines-val">3</span></label>
      <input type="range" id="max-lines" min="1" max="5" value="3">
    </div>

    <div class="control-row">
      <label for="fade-timeout">Fade-out Delay: <span id="fade-timeout-val">6s</span></label>
      <input type="range" id="fade-timeout" min="2" max="15" value="6">
    </div>
  </div>

  <div class="section replay-section">
    <div class="section-label">Smart Replay (asbplayer style)</div>

    <div class="control-row row-flex">
      <label for="sub-nav-enabled">Smart Replay on Left Arrow (←):</label>
      <input type="checkbox" id="sub-nav-enabled" checked>
    </div>

    <div class="control-row row-flex">
      <label for="sub-nav-play">Auto-play on replay when paused:</label>
      <input type="checkbox" id="sub-nav-play" checked>
    </div>

    <div class="control-row">
      <label for="sub-nav-padding">Replay Padding: <span id="sub-nav-padding-val">150ms</span></label>
      <input type="range" id="sub-nav-padding" min="0" max="500" step="25" value="150">
    </div>
  </div>

  <div class="section server-section">
    <div class="section-label">Server Endpoint:</div>
    <div class="server-input-row">
      <input type="text" id="server-url" value="http://127.0.0.1:8989" placeholder="http://127.0.0.1:8989">
      <button id="connect-btn" class="btn btn-primary" title="Save endpoint and connect">Connect</button>
      <button id="retry-btn" class="btn btn-secondary-btn" title="Force retry connection">Retry</button>
    </div>
  </div>

  <div class="footer">
    <button id="test-sub-btn" class="btn btn-secondary">Send Test Subtitle</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
